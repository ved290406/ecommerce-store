<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkout</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<div class="navbar">

  <div class="logo" onclick="goHome()">🛒 LJ Store</div>

  <div class="nav-right">
    <div class="nav-item" onclick="goHome()">🏠 Home</div>
    <div class="nav-item" onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</div>
  </div>

</div>

<!-- ================= CHECKOUT ================= -->
<div class="checkout-container">

  <div class="checkout">

    <h2>Checkout</h2>

    <!-- USER DETAILS -->
    <input type="text" id="name" placeholder="Full Name">
<input type="text" id="address" placeholder="Address">
<input type="number" id="phone" placeholder="Phone Number">
    <!-- PAYMENT METHODS -->
    <h3>Select Payment Method</h3>

    <div class="payment-box">

      <label>
        <input type="radio" name="payment" value="UPI">
        📱 UPI
      </label>

      <label>
        <input type="radio" name="payment" value="Card">
        💳 Debit / Credit Card
      </label>

      <label>
        <input type="radio" name="payment" value="COD">
        💵 Cash on Delivery
      </label>

    </div>

    <!-- TOTAL -->
    <h3>Total: ₹<span id="total">0</span></h3>

    <!-- BUTTON -->
    <button onclick="placeOrder()">Place Order</button>
    <button onclick="startPayment()">Pay & Place Order</button>

  </div>

</div>

<!-- ================= SCRIPT ================= -->
<script src="script.js"></script>

<script>

/* ===============================
   LOAD TOTAL FROM CART
================================ */
function loadTotal() {

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  let total = 0;

  cart.forEach(item => {
    total += item.price;
  });

  document.getElementById("total").innerText = total;
}

/* ===============================
   NAV FUNCTIONS
================================ */
function goHome() {
  window.location.href = "index.html";
}

function openCart() {
  window.location.href = "cart.html";
}

/* ===============================
   INIT
================================ */
window.addEventListener("DOMContentLoaded", () => {
  loadTotal();
  updateCart();
});

</script>

</body>
</html>
